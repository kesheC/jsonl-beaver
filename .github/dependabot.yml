# Two ecosystems cover everything this repository installs: the workflow
# actions (pinned to commit shas, so a bump has to move the sha and the
# version comment together) and the dev toolchain in package-lock.json.
#
# The tarball ships zero runtime dependencies, so "npm" here is the build
# and test toolchain -- which is still the whole supply chain.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      toolchain:
        patterns:
          - "*"
