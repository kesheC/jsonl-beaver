name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node is >=20.11, so 20 is the floor we promise; 24 is
        # the current active LTS. Every version we claim to support runs here.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # build only joins src; this also typechecks the test files.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The tarball is what users install, so the tarball is what CI runs.
      - name: Smoke test the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls jsonl-beaver-*.tgz | head -n 1)
          if [ ! -f "$TARBALL" ]; then echo "npm pack produced nothing" >&2; exit 1; fi
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          # Compare against package.json, not just "did it exit 0": a broken
          # entry guard makes the CLI exit 0 having printed nothing.
          expected=$(node -p "require('./node_modules/jsonl-beaver/package.json').version")
          actual=$(./node_modules/.bin/jlb --version)
          echo "jlb --version = $actual (expected $expected)"
          [ "$actual" = "$expected" ] || { echo "version mismatch" >&2; exit 1; }
