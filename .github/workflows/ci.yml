name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node is >=20.11: that is the floor for the shipped CLI, and
        # 20 is the oldest line we promise it on. 24 is the current active LTS,
        # so the newest column keeps the promise honest on a current runtime.
        # (Contributors need a newer 20.x: vitest 4 -> vite 8 wants ^20.19.0.)
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The package ships zero runtime dependencies, so the dev dependencies
      # are the whole supply chain. A high or critical advisory in the
      # toolchain is worth stopping for; moderate and low ones get read on
      # the next dependency bump instead of blocking an unrelated fix.
      - name: Audit dev dependencies
        run: npm audit --audit-level=high

      # build only joins src; this also typechecks the test files.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The tarball is what users install, so the tarball is what CI runs.
      - name: Smoke test the packed tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls jsonl-beaver-*.tgz | head -n 1)
          if [ ! -f "$TARBALL" ]; then echo "npm pack produced nothing" >&2; exit 1; fi

          # --- package contents ---
          # Run from the repo root, before any `cd`: `npm pack` packs the
          # package in the current directory, so doing this after moving to a
          # throwaway directory would inspect that empty package instead of
          # ours and always pass.
          npm pack --dry-run --json > pack-meta.json
          node -e "
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('pack-meta.json', 'utf8'));
          const files = meta[0].files.map((f) => f.path);
          const dist = files.filter((p) => p.startsWith('dist/'));
          const problems = [];
          if (!files.includes('dist/index.js')) problems.push('dist/index.js is missing from the tarball');
          if (!files.includes('dist/cli.js')) problems.push('dist/cli.js is missing from the tarball');
          if (!files.includes('dist/index.d.ts')) problems.push('dist/index.d.ts is missing, so the types do not ship');
          if (dist.length === 0) problems.push('the tarball has no dist/ entries at all');
          for (const bad of ['tests/', 'src/', 'node_modules/']) {
            if (files.some((p) => p.startsWith(bad))) problems.push('the tarball leaks ' + bad);
          }
          if (files.some((p) => p.endsWith('.js.map'))) problems.push('the tarball ships .js.map files that point at sources it does not contain');
          if (problems.length > 0) { console.error(problems.join('\n')); process.exit(1); }
          console.log('package contents ok: ' + files.length + ' entries, ' + dist.length + ' under dist/');
          "

          # --- the installed artifact ---
          # Install into a throwaway directory and run every assertion from
          # there, so node resolves "jsonl-beaver" to node_modules/jsonl-beaver
          # (the packed artifact) and never to the checkout.
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          # Compare against package.json, not just "did it exit 0": a broken
          # entry guard makes the CLI exit 0 having printed nothing.
          expected=$(node -p "require('./node_modules/jsonl-beaver/package.json').version")
          actual=$(./node_modules/.bin/jlb --version)
          echo "jlb --version = $actual (expected $expected)"
          [ "$actual" = "$expected" ] || { echo "version mismatch" >&2; exit 1; }

          # The CLI working says nothing about the library. Import the packed
          # entry point and assert the public surface is actually reachable.
          # Every name below is exported by src/index.ts; a broken exports map
          # or a missing dist file fails here rather than on a user's machine.
          node --input-type=module -e "
          const m = await import('jsonl-beaver');
          const names = Object.keys(m);
          if (names.length === 0) { console.error('jsonl-beaver exports nothing'); process.exit(1); }
          for (const required of ['collectStat', 'runHead', 'runFilter', 'runAgg', 'runToCsv', 'runToJsonl', 'streamJsonl', 'compileExpr', 'toCsv', 'renderStat', 'openOutputSink']) {
            if (typeof m[required] !== 'function') {
              console.error('missing library export: ' + required);
              process.exit(1);
            }
          }
          if (typeof m.VERSION !== 'string' || m.VERSION.length === 0) {
            console.error('missing library export: VERSION (expected a non-empty string)');
            process.exit(1);
          }
          console.log('library import ok, ' + names.length + ' exports');
          "
