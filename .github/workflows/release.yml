name: Release

# Building the tarball in CI and attaching it to the GitHub Release is the
# installation path users actually get to run. Installing a TypeScript CLI
# straight from a git URL does not work on npm 11: global installs skip
# devDependencies, so the `prepare` build finds no tsc, and even when dist is
# committed the global install lands as a symlink into npm's throw-away git
# clone. A packed tarball has no such problem.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: pack and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls jsonl-beaver-*.tgz | head -n 1)
          if [ ! -f "$TARBALL" ]; then echo "npm pack produced nothing" >&2; exit 1; fi
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          # The README links releases/latest/download/jsonl-beaver.tgz, so the
          # asset name must not carry the version. Ship both: the stable name
          # for readers, the versioned name so old links keep resolving.
          cp "$TARBALL" jsonl-beaver.tgz
          # Regenerate rather than copy: a checksum file names the asset it
          # covers, so copying would leave it pointing at the versioned
          # filename and a sha256sum check of the stable name would fail.
          sha256sum jsonl-beaver.tgz > jsonl-beaver.tgz.sha256
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          cat "$TARBALL.sha256"
      - name: Smoke test the tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="${{ steps.pack.outputs.tarball }}"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          # The stable-named copy is what the README tells people to install.
          # It gets its own empty directory on purpose: installing it next to
          # the versioned tarball is a no-op, because npm sees the same
          # name+version already satisfied and never reads the new file.
          mkdir -p /tmp/smoke-stable && cd /tmp/smoke-stable
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/jsonl-beaver.tgz"
          test -x ./node_modules/.bin/jlb
          # Compare against package.json, not just "did it exit 0": a broken
          # entry guard makes the CLI exit 0 having printed nothing.
          expected=$(node -p "require('./node_modules/jsonl-beaver/package.json').version")
          actual=$(./node_modules/.bin/jlb --version)
          echo "jlb --version = $actual (expected $expected)"
          [ "$actual" = "$expected" ] || { echo "version mismatch" >&2; exit 1; }
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="${{ steps.pack.outputs.tarball }}"
          # --- tag/version gate ---
          # Publishing is tag-driven, so the tag is the only thing that says
          # which version this is. If it disagrees with package.json the job
          # happily uploads 0.1.6 assets under a v0.1.7 label. Gate before any
          # gh call, and before the CHANGELOG lookup below: with a drifted tag
          # the CHANGELOG error fires first and points at the wrong problem.
          # The smoke test above compares `jlb --version` to the version inside
          # the installed package, which are equal by construction, so it can
          # never catch this. Only this comparison can.
          # Inline node -e on purpose: the repo is "type":"module", so a saved
          # .js file would be ESM and `require` would not exist there.
          node -e '
          const fs = require("fs");
          const tag = process.argv[1];
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const parsed = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$/.exec(tag);
          if (!parsed) {
            console.error("tag is not a vX.Y.Z tag: " + tag);
            process.exit(1);
          }
          if (parsed[1] !== version) {
            console.error("tag/version mismatch: tag says " + parsed[1] + ", package.json says " + version);
            process.exit(1);
          }
          console.log("tag " + tag + " matches package.json version " + version);
          ' "$TAG"
          # The release body is the CHANGELOG section for this tag, so a reader
          # who lands on the release page sees what changed without a second
          # hop. Failing when the section is missing is deliberate: a tag with
          # no write-up is a release nobody can evaluate.
          node -e '
          const fs = require("fs");
          const tag = process.argv[1].replace(/^v/, "");
          const head = "## [" + tag + "]";
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          const out = [];
          let on = false;
          for (const line of lines) {
            if (line.startsWith("## [")) {
              if (on) break;
              if (line.startsWith(head)) { on = true; continue; }
            }
            if (on) out.push(line);
          }
          const body = out.join("\n").trim();
          if (!body) { console.error("CHANGELOG.md has no section for " + tag); process.exit(1); }
          fs.writeFileSync("RELEASE_NOTES.md", body + "\n");
          ' "$TAG"
          gh release view "$TAG" -R "$REPO" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --title "$TAG" --notes-file RELEASE_NOTES.md
          # GitHub turns a release into a draft if its tag is ever deleted and
          # re-pushed. Publishing explicitly makes the job idempotent either way;
          # on an already-published release this is a no-op.
          gh release edit "$TAG" -R "$REPO" --draft=false --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" jsonl-beaver.tgz jsonl-beaver.tgz.sha256 -R "$REPO" --clobber
          ASSETS=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name')
          echo "$ASSETS"
          for expected in jsonl-beaver.tgz jsonl-beaver.tgz.sha256; do
            if ! printf '%s\n' "$ASSETS" | grep -qx "$expected"; then
              echo "missing release asset: $expected" >&2
              exit 1
            fi
          done
